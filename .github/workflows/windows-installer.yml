name: Build Refresh Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore WindowsAdvertisingQaManager.csproj

      - name: Publish self-contained Windows x64 executable
        run: >
          dotnet publish WindowsAdvertisingQaManager.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          --output publish-app

      - name: Install Inno Setup
        run: choco install innosetup --yes --no-progress

      - name: Build click-through installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found: $iscc" }
          & $iscc "Refresh.iss"
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }

      - name: Verify installer and executable
        shell: pwsh
        run: |
          if (!(Test-Path "publish-app\Refresh.exe")) { throw "Refresh.exe missing" }
          if (!(Test-Path "publish\Refresh_Setup.exe")) { throw "Refresh_Setup.exe missing" }
          Get-Item "publish-app\Refresh.exe", "publish\Refresh_Setup.exe" | Format-Table Name,Length

      - name: Upload Windows build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Refresh-Windows-x64
          path: |
            publish/Refresh_Setup.exe
            publish-app/Refresh.exe
          if-no-files-found: error
          retention-days: 30
